<svg xmlns="http://www.w3.org/2000/svg" width="120" height="280" viewBox="0 0 120 280">
  <style>
    text { font-family: "Latin Modern Math", "STIX Two Math", serif; font-size: 14px; }
    line, path, polyline { stroke: black; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Top terminal -->
  <line x1="60" y1="10" x2="60" y2="30"/>
  <circle cx="60" cy="10" r="3" fill="black"/>

  <!-- Capacitor (top) -->
  <line x1="60" y1="30" x2="60" y2="75"/>
  <line x1="40" y1="75" x2="80" y2="75"/>
  <line x1="40" y1="83" x2="80" y2="83"/>
  <line x1="60" y1="83" x2="60" y2="110"/>
  <text x="85" y="83" dominant-baseline="middle">C</text>

  <!-- Inductor (middle) -->
  <path d="M60,110
    Q60,118 60,122
    Q52,122 52,130 Q52,138 60,138
    Q52,138 52,146 Q52,154 60,154
    Q52,154 52,162 Q52,170 60,170
    Q60,174 60,178"/>
  <text x="85" y="144" dominant-baseline="middle">L</text>

  <!-- Resistor (bottom) -->
  <polyline points="60,178 60,188 50,192 70,200 50,208 70,216 50,224 70,232 60,236 60,246"/>
  <text x="85" y="212" dominant-baseline="middle">R</text>

  <!-- Bottom terminal -->
  <line x1="60" y1="246" x2="60" y2="268"/>
  <circle cx="60" cy="268" r="3" fill="black"/>

  <!-- Zin arrow -->
  <line x1="25" y1="170" x2="25" y2="130"/>
  <polyline points="20,140 25,128 30,140"/>
  <text x="5" y="155" font-style="italic">Z</text>
  <text x="16" y="160" font-size="10px">in</text>

  <!-- + - labels -->
  <text x="68" y="16" font-size="12px">+</text>
  <text x="68" y="270" font-size="12px">−</text>
</svg>
