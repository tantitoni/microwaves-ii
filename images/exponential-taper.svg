<svg xmlns="http://www.w3.org/2000/svg" width="240" height="140" viewBox="0 0 240 140">
  <style>
    text { font-family: "Latin Modern Math", "STIX Two Math", serif; font-size: 13px; font-style: italic; }
    line, path { stroke: black; stroke-width: 1.8; fill: none; }
  </style>

  <!-- Top exponential curve: e^(kx) shape -->
  <path d="M 30,70 C 90,68 140,60 210,25"/>
  <!-- Bottom exponential curve (mirror) -->
  <path d="M 30,70 C 90,72 140,80 210,115"/>

  <!-- Right cap -->
  <line x1="210" y1="25" x2="210" y2="115"/>

  <!-- Z ~ 1/w annotation -->
  <text x="135" y="20" font-size="13px">Z ∝ 1/w</text>

  <!-- Z_L > 1 annotation -->
  <text x="70" y="135" font-size="13px">Z̃</text>
  <text x="82" y="140" font-size="10px">L</text>
  <text x="92" y="135" font-size="13px" font-style="normal">&gt; 1</text>
</svg>
