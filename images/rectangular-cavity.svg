<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220" viewBox="0 0 380 220">
  <style>
    text { font-family: "Latin Modern Math", "STIX Two Math", serif; font-size: 14px; }
    .dim  { stroke: #cc0000; stroke-width: 1.5; fill: none; }
    .box  { stroke: #111; stroke-width: 2; fill: #f0f0f0; }
    .face { stroke: #111; stroke-width: 2; fill: #e0e8f0; }
    .wave { stroke: #1a5fc8; stroke-width: 2.5; fill: none; }
    .dimtext { fill: #cc0000; font-style: italic; font-size: 15px; }
    .label   { fill: #1a5fc8; font-style: italic; }
  </style>

  <!-- Back face -->
  <polygon class="box" points="110,20 230,20 230,130 110,130"/>

  <!-- Top face -->
  <polygon class="box" points="60,50 110,20 230,20 180,50"/>

  <!-- Front face (visible interior side) -->
  <polygon class="face" points="60,50 60,160 110,130 110,20"/>

  <!-- Bottom face -->
  <polygon class="box" points="60,160 110,130 230,130 180,160"/>

  <!-- Standing wave: from bottom-left of front face to bottom-right, arching to TOP of front face -->
  <!-- Front face corners: top-left(60,50), bottom-left(60,160), top-right(110,20), bottom-right(110,130) -->
  <!-- Wave bottom spans from (60,160) to (110,130), peak at top midpoint (~85,35) -->
  <path class="wave" d="M60,160 Q85,20 110,130"/>

  <!-- dimension b (height of front face, left side) -->
  <line class="dim" x1="42" y1="50"  x2="42" y2="160"/>
  <line class="dim" x1="37" y1="50"  x2="47" y2="50"/>
  <line class="dim" x1="37" y1="160" x2="47" y2="160"/>
  <text class="dimtext" x="27" y="112">b</text>

  <!-- dimension a (depth, along bottom-left edge) -->
  <line class="dim" x1="60" y1="175" x2="110" y2="145"/>
  <line class="dim" x1="60" y1="168" x2="60" y2="178"/>
  <line class="dim" x1="110" y1="138" x2="110" y2="152"/>
  <text class="dimtext" x="72" y="176">a</text>

  <!-- dimension d (length, along bottom) -->
  <line class="dim" x1="110" y1="152" x2="230" y2="152"/>
  <line class="dim" x1="110" y1="147" x2="110" y2="157"/>
  <line class="dim" x1="230" y1="147" x2="230" y2="157"/>
  <text class="dimtext" x="163" y="170">d</text>

  <!-- n λ/2 label -->
  <text class="label" x="240" y="155">n</text>
  <text class="label" x="253" y="150" font-size="13px">λ</text>
  <line stroke="#1a5fc8" stroke-width="1.2" x1="253" y1="151" x2="264" y2="151"/>
  <text class="label" x="255" y="163" font-size="13px">2</text>

  <!-- all faces PEC label -->
  <text x="270" y="70" font-size="13px" fill="#333">all faces</text>
  <text x="270" y="87" font-size="13px" fill="#333">PEC</text>
</svg>
