<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200">
  <style>
    text { font-family: "Latin Modern Math", "STIX Two Math", serif; font-size: 13px; font-style: italic; }
    line, path { stroke: black; stroke-width: 1.5; fill: none; }
    .arrow { stroke: black; stroke-width: 1.3; fill: none; }
    .dot { fill: black; }
  </style>

  <!-- Three transmission-line sections (top) -->
  <!-- section 1 -->
  <line x1="20" y1="45" x2="140" y2="45"/>
  <line x1="20" y1="70" x2="140" y2="70"/>
  <line x1="20" y1="45" x2="20" y2="70"/>
  <!-- section 2 -->
  <line x1="140" y1="40" x2="280" y2="40"/>
  <line x1="140" y1="75" x2="280" y2="75"/>
  <!-- section 3 -->
  <line x1="280" y1="45" x2="420" y2="45"/>
  <line x1="280" y1="70" x2="420" y2="70"/>
  <line x1="420" y1="45" x2="420" y2="70"/>

  <!-- Interface dots -->
  <circle class="dot" cx="140" cy="57.5" r="2.5"/>
  <circle class="dot" cx="280" cy="57.5" r="2.5"/>

  <!-- Section labels -->
  <text x="60"  y="63">Z_ch1</text>
  <text x="190" y="63">Z_ch2</text>
  <text x="330" y="63">Z_ch3</text>

  <!-- Equivalent single line (bottom) with reflection arrows at three points -->
  <line x1="20" y1="150" x2="420" y2="150"/>
  <circle class="dot" cx="140" cy="150" r="2.5"/>
  <circle class="dot" cx="200" cy="150" r="2.5"/>
  <circle class="dot" cx="280" cy="150" r="2.5"/>

  <!-- Γ1 arrow (curves up-left) -->
  <path class="arrow" d="M 140,150 C 130,130 120,125 118,118"/>
  <polygon points="118,118 114,126 122,124" fill="black"/>
  <text x="110" y="175">Γ₁</text>

  <!-- Γ2 arrow -->
  <path class="arrow" d="M 200,150 C 190,130 180,125 178,118"/>
  <polygon points="178,118 174,126 182,124" fill="black"/>
  <text x="170" y="175">Γ₂</text>

  <!-- Γ3 arrow -->
  <path class="arrow" d="M 280,150 C 290,130 300,125 302,118"/>
  <polygon points="302,118 306,126 298,124" fill="black"/>
  <text x="294" y="175">Γ₃</text>
</svg>
