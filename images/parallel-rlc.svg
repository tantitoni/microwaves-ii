<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <style>
    text { font-family: "Latin Modern Math", "STIX Two Math", serif; font-size: 14px; }
    line, path, polyline { stroke: black; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Top rail -->
  <line x1="30" y1="40" x2="290" y2="40"/>
  <!-- Bottom rail -->
  <line x1="30" y1="160" x2="290" y2="160"/>

  <!-- Left terminal -->
  <circle cx="30" cy="40" r="3" fill="black"/>
  <circle cx="30" cy="160" r="3" fill="black"/>

  <!-- Right terminal -->
  <circle cx="290" cy="40" r="3" fill="black"/>
  <circle cx="290" cy="160" r="3" fill="black"/>

  <!-- G (conductance / resistor) -->
  <line x1="90" y1="40" x2="90" y2="60"/>
  <polyline points="90,60 80,64 100,72 80,80 100,88 80,96 100,104 90,108"/>
  <line x1="90" y1="108" x2="90" y2="160"/>
  <circle cx="90" cy="40" r="3" fill="black"/>
  <circle cx="90" cy="160" r="3" fill="black"/>
  <text x="100" y="90" dominant-baseline="middle">G</text>

  <!-- L (inductor) -->
  <line x1="170" y1="40" x2="170" y2="65"/>
  <path d="M170,65
    Q162,65 162,73 Q162,81 170,81
    Q162,81 162,89 Q162,97 170,97
    Q162,97 162,105 Q162,113 170,113
    Q170,117 170,120"/>
  <line x1="170" y1="120" x2="170" y2="160"/>
  <circle cx="170" cy="40" r="3" fill="black"/>
  <circle cx="170" cy="160" r="3" fill="black"/>
  <text x="180" y="95" dominant-baseline="middle">L</text>

  <!-- C (capacitor) -->
  <line x1="250" y1="40" x2="250" y2="93"/>
  <line x1="230" y1="93" x2="270" y2="93"/>
  <line x1="230" y1="101" x2="270" y2="101"/>
  <line x1="250" y1="101" x2="250" y2="160"/>
  <circle cx="250" cy="40" r="3" fill="black"/>
  <circle cx="250" cy="160" r="3" fill="black"/>
  <text x="275" y="100" dominant-baseline="middle">C</text>

  <!-- Yin arrow -->
  <line x1="15" y1="120" x2="15" y2="80"/>
  <polyline points="10,90 15,78 20,90"/>
  <text x="0" y="108" font-style="italic" font-size="13px">Y</text>
  <text x="11" y="113" font-size="10px">in</text>
</svg>
