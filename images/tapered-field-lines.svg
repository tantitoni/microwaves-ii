<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <style>
    text { font-family: "Latin Modern Math", "STIX Two Math", serif; font-size: 14px; font-style: italic; }
    line, path { stroke: black; stroke-width: 1.8; fill: none; }
    .field { stroke: black; stroke-width: 1; fill: none; }
  </style>

  <!-- Top taper curve -->
  <path d="M 20,30 C 100,30 160,70 220,95"/>
  <!-- Bottom taper curve -->
  <path d="M 20,170 C 100,170 160,130 220,105"/>

  <!-- Straight narrow section to right -->
  <line x1="220" y1="95"  x2="300" y2="95"/>
  <line x1="220" y1="105" x2="300" y2="105"/>

  <!-- Left cap -->
  <line x1="20" y1="30"  x2="20"  y2="170"/>

  <!-- Vertical field lines inside the taper (representing incremental slices) -->
  <line class="field" x1="35"  y1="31"  x2="35"  y2="169"/>
  <line class="field" x1="55"  y1="31"  x2="55"  y2="168"/>
  <line class="field" x1="75"  y1="32"  x2="75"  y2="167"/>
  <line class="field" x1="95"  y1="34"  x2="95"  y2="165"/>
  <line class="field" x1="115" y1="40"  x2="115" y2="160"/>
  <line class="field" x1="135" y1="48"  x2="135" y2="152"/>
  <line class="field" x1="155" y1="58"  x2="155" y2="142"/>
  <line class="field" x1="175" y1="70"  x2="175" y2="130"/>
  <line class="field" x1="195" y1="83"  x2="195" y2="117"/>
</svg>
